name = "hex-mv-poly-theory"
defaultTargets = ["HexMvPolyTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "v0.10.0"

[[require]]
name = "HexMvPoly"
git = "https://github.com/leanprover/hex-mv-poly.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyTheory"
git = "https://github.com/leanprover/hex-poly-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexModArithTheory"
git = "https://github.com/leanprover/hex-mod-arith-theory.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexMvPolyTheory"

[[lean_lib]]
name = "HexMvPolyTheoryTests"
globs = ["HexMvPolyTheory.KernelResidueTests"]
